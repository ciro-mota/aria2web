<!doctype html>
<html lang="pt-BR" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aria2Web</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

<div id="a" class="field has-addons is-justify-content-center">
  <div class="control"><input id="t" class="input" type="password" placeholder="RPC Token"></div>
  <div class="control"><button class="button is-link" onclick="connect()">Connect</button></div>
</div>

<button id="x" class="button is-small" onclick="logout()" hidden><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M14 14.252V16.3414C13.3744 16.1203 12.7013 16 12 16C8.68629 16 6 18.6863 6 22H4C4 17.5817 7.58172 14 12 14C12.6906 14 13.3608 14.0875 14 14.252ZM12 13C8.685 13 6 10.315 6 7C6 3.685 8.685 1 12 1C15.315 1 18 3.685 18 7C18 10.315 15.315 13 12 13ZM12 11C14.21 11 16 9.21 16 7C16 4.79 14.21 3 12 3C9.79 3 8 4.79 8 7C8 9.21 9.79 11 12 11ZM19 17.5858L21.1213 15.4645L22.5355 16.8787L20.4142 19L22.5355 21.1213L21.1213 22.5355L19 20.4142L16.8787 22.5355L15.4645 21.1213L17.5858 19L15.4645 16.8787L16.8787 15.4645L19 17.5858Z"></path></svg></span><span>Logout</span></button>

<p id="m" class="has-text-danger"></p>
<div class="field has-addons my-4">
  <div class="control is-expanded"><input id="u" class="input" placeholder="URL or magnet"></div>
  <div class="control"><button class="button is-link" onclick="add()">Add</button></div>
</div>

<div class="field">
  <div class="control"><div class="select is-fullwidth"><select id="pasta"></select></div></div>
</div>

<ul id="l"></ul>

<div id="mod" class="modal">
  <div class="modal-background" onclick="fechar()"></div>
  <div class="modal-card">
    <header class="modal-card-head"><p class="modal-card-title is-size-5">Remove download</p></header>
    <section class="modal-card-body">
      <p id="mn"></p>
      <p class="is-size-7 mt-2">Deleting from the disk cannot be undone</p>
    </section>
    <footer class="modal-card-foot is-justify-content-center">
      <button class="button is-small" onclick="remover(false)">Only from list</button>
      <button class="button is-small is-danger" onclick="remover(true)">From list and disk</button>
      <button class="button is-small" onclick="fechar()">Cancel</button>
    </footer>
  </div>
</div>
